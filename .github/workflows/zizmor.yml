name: zizmor
# Static analysis of GitHub Actions workflows: https://docs.zizmor.sh
on:
  # Every pull request, so that the "zizmor" check always reports and can be required in branch
  # protection (docs/dependencies.md). It takes seconds.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"
permissions: {}
concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fails the check when zizmor reports anything, with inline annotations on the PR.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.31.1"
          advanced-security: false
          annotations: true
  # Uploads the same results as SARIF to the repository's code scanning alerts, from main only:
  # on a pull request the upload adds a second check named "zizmor" (from code scanning) next to
  # the job above, with the same result. Kept as a separate job so that only it gets
  # security-events: write.
  sarif:
    name: zizmor (code scanning)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.31.1"
